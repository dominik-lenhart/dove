# nginx equivalent of deploy/Caddyfile. Include it from the http {} context, for example as
# /etc/nginx/conf.d/dove.conf. Replace dove.example.com (it must equal the host in `public_url`) and the
# certificate paths (Let's Encrypt via certbot shown). nginx does not obtain certificates by itself.
#
# Allowlist: only the exact method + path pairs below reach Dove. Everything else is answered with 404 by nginx.
# Not listed on purpose: /healthz (it discloses "degraded" when a mailbox needs re-authorization; probe the
# loopback listener instead) and anything admin-related (the admin interface is a Unix socket, not HTTP).

# Exact, case-sensitive method + path pairs (the "~" prefix makes a map key a case-sensitive regular expression;
# plain map keys would match case-insensitively). Regex dots are escaped.
map "$request_method $uri" $dove_allowed {
    default 0;
    "~^POST /mcp$"                                              1;
    "~^GET /oauth/google/callback$"                             1;
    "~^GET /\.well-known/oauth-protected-resource$"             1;
    "~^GET /\.well-known/oauth-protected-resource/mcp$"         1;
    "~^GET /\.well-known/oauth-authorization-server$"           1;
    "~^GET /oauth/dove/authorize$"                              1;
    "~^POST /oauth/dove/authorize$"                             1;
    "~^POST /oauth/dove/token$"                                 1;
    "~^POST /oauth/dove/register$"                              1;
    "~^POST /oauth/dove/revoke$"                                1;
    "~^POST /connect/redeem$"                                   1;
}

# Dove sets its own Referrer-Policy (same-origin on the approval page, which posts a form to itself; no-referrer
# elsewhere). Only add no-referrer to responses that come without one, such as the proxy's own 403 and 404.
map $upstream_http_referrer_policy $dove_referrer_policy {
    ""      "no-referrer";
    default "";
}

# Access log format for the Dove server blocks below: path without the query string (it carries OAuth codes).
log_format dove_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name dove.example.com;
    # Certificate issuance (http-01) uses a webroot or the nginx plugin of your ACME client; add its location here.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dove.example.com;

    ssl_certificate     /etc/letsencrypt/live/dove.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dove.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    # Keep // as it is, so $uri matches the path that is actually forwarded.
    merge_slashes off;
    # Client address: never take it from a header. A real_ip rule of another site in the same http {} context (for
    # example Cloudflare's CF-Connecting-IP) would otherwise apply here too, and a request from that network could
    # claim any address, including an allowed one. 192.0.2.1 is a documentation address that never connects.
    set_real_ip_from 192.0.2.1/32;
    real_ip_header X-Dove-Unused;
    # Log without query strings: OAuth codes and states travel in them (the Google callback). The server-wide log
    # usually records the full request line and is often world-readable.
    access_log /var/log/nginx/dove.access.log dove_noquery;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy $dove_referrer_policy always;

    # Request size limit (spec 6.6). Dove enforces its own, smaller limits: limits.body_bytes (1 MiB) for everyone,
    # and up to limits.draft_attachment_bytes * 4/3 + 2 MiB (about 15.3 MiB) for authenticated clients that create
    # drafts with inline attachments. This must stay at least that large.
    client_max_body_size 20m;

    location / {
        if ($dove_allowed = 0) { return 404; }

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set, not append: the client address is the only X-Forwarded-For entry, so it cannot be forged.
        # Dove believes it only together with the proxy secret (secrets.proxy_secret_file in config.toml), so a local
        # process that connects to 127.0.0.1:8787 directly cannot pick its address. nginx cannot read a header value
        # from a file, so the secret lives in an included snippet that only root can read (docs/deployment.md):
        #   proxy_set_header X-Dove-Proxy-Auth "<content of /etc/dove/credentials/proxy_secret>";
        # It replaces any client-sent X-Dove-Proxy-Auth header. Keep it next to the other proxy_set_header lines:
        # nginx inherits proxy_set_header from outer blocks only when a block sets none itself.
        proxy_set_header X-Forwarded-For $remote_addr;
        include /etc/nginx/dove_proxy_auth.conf;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
