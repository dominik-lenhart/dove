# nginx equivalent of deploy/Caddyfile. Include it from the http {} context, for example as
# /etc/nginx/conf.d/dove.conf. Replace dove.example.com (it must equal the host in `public_url`) and the
# certificate paths (Let's Encrypt via certbot shown). nginx does not obtain certificates by itself.
#
# Allowlist: only the exact method + path pairs below reach Dove. Everything else is answered with 404 by nginx.
# Not listed on purpose: /healthz (it discloses "degraded" when a mailbox needs re-authorization; probe the
# loopback listener instead) and anything admin-related (the admin interface is a Unix socket, not HTTP).

# Exact, case-sensitive method + path pairs (the "~" prefix makes a map key a case-sensitive regular expression;
# plain map keys would match case-insensitively). Regex dots are escaped.
map "$request_method $uri" $dove_allowed {
    default 0;
    "~^POST /mcp$"                                              1;
    "~^GET /oauth/google/callback$"                             1;
    "~^GET /\.well-known/oauth-protected-resource$"             1;
    "~^GET /\.well-known/oauth-protected-resource/mcp$"         1;
    "~^GET /\.well-known/oauth-authorization-server$"           1;
    "~^GET /oauth/dove/authorize$"                              1;
    "~^POST /oauth/dove/authorize$"                             1;
    "~^POST /oauth/dove/token$"                                 1;
    "~^POST /oauth/dove/register$"                              1;
    "~^POST /oauth/dove/revoke$"                                1;
    "~^POST /connect/redeem$"                                   1;
}

server {
    listen 80;
    listen [::]:80;
    server_name dove.example.com;
    # Certificate issuance (http-01) uses a webroot or the nginx plugin of your ACME client; add its location here.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dove.example.com;

    ssl_certificate     /etc/letsencrypt/live/dove.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dove.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    # Keep // as it is, so $uri matches the path that is actually forwarded.
    merge_slashes off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Request size limit (spec 6.6). Dove enforces the same limit (limits.body_bytes, default 1 MiB).
    client_max_body_size 1m;

    location / {
        if ($dove_allowed = 0) { return 404; }

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set, not append: the client address is the only X-Forwarded-For entry, so it cannot be forged.
        # Dove takes the last entry when the peer is loopback (src/http.rs).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
