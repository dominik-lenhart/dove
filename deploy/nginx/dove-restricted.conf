# nginx/Angie site for Dove that only lets Claude's and ChatGPT's servers (and addresses you add) reach the machine
# endpoints. Same allowlist as dove.conf; see docs/deployment.md, "Restrict to Claude and ChatGPT".
#
# Needs, in the http {} context:
#   - /etc/nginx/dove_allow.conf: the `geo $dove_ip_ok` block written by dove-allowlist.py (run from a timer);
#   - /etc/nginx/dove_proxy_auth.conf (root only): proxy_set_header X-Dove-Proxy-Auth "<proxy secret>";
# Replace dove.example.com and the certificate lines (Angie's built-in ACME client shown, certbot paths for nginx).

include /etc/nginx/dove_allow.conf;

# 1 = machine endpoint (Claude/ChatGPT servers only), 2 = browser endpoint (any address; protected by a one-time
# invitation or the OAuth state), 0 = not part of Dove's public surface.
map "$request_method $uri" $dove_route {
    default 0;
    "~^POST /mcp$"                                              1;
    "~^GET /\.well-known/oauth-protected-resource$"             1;
    "~^GET /\.well-known/oauth-protected-resource/mcp$"         1;
    "~^GET /\.well-known/oauth-authorization-server$"           1;
    "~^POST /oauth/dove/token$"                                 1;
    "~^POST /oauth/dove/register$"                              1;
    "~^POST /oauth/dove/revoke$"                                1;
    "~^GET /oauth/dove/authorize$"                              2;
    "~^POST /oauth/dove/authorize$"                             2;
    "~^GET /oauth/google/callback$"                             2;
    "~^POST /connect/redeem$"                                   2;
}

# A machine endpoint from an address outside the allowlist is refused.
map "$dove_route:$dove_ip_ok" $dove_block {
    default 0;
    "1:0"   1;
}

# Browser endpoints take invitation codes: slow down guessing on top of Dove's own per-address limits. An empty key
# is not limited, so the machine endpoints (shared provider addresses) are not throttled here.
map $dove_route $dove_browser_key {
    default "";
    2       $binary_remote_addr;
}
limit_req_zone $dove_browser_key zone=dove_browser:10m rate=30r/m;

# Dove sets its own Referrer-Policy (same-origin on the approval page, which posts a form to itself; no-referrer
# elsewhere). Only add no-referrer to responses that come without one, such as the proxy's own 403 and 404.
map $upstream_http_referrer_policy $dove_referrer_policy {
    ""      "no-referrer";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name dove.example.com;
    acme letsencrypt;                       # Angie; with nginx, put your ACME client's http-01 location here
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dove.example.com;

    acme letsencrypt;
    ssl_certificate     $acme_cert_letsencrypt;
    ssl_certificate_key $acme_cert_key_letsencrypt;
    # nginx + certbot instead:
    # ssl_certificate     /etc/letsencrypt/live/dove.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dove.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    merge_slashes off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy $dove_referrer_policy always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # At least Dove's own largest limit (draft attachments, about 15.3 MiB); see dove.conf.
    client_max_body_size 20m;

    location / {
        if ($dove_route = 0) { return 404; }
        if ($dove_block) { return 403; }
        limit_req zone=dove_browser burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        include /etc/nginx/dove_proxy_auth.conf;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
