name: Release

# Runs when a tag vX.Y.Z is pushed. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

# Every job declares its own minimal permissions.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  IMAGE: ghcr.io/dominik-lenhart/dove
  # Windows release (x86_64-pc-windows-msvc zip, listed in SHA256SUMS and the signature like every other asset).
  # On since 0.5.0-rc.1 (the Windows port, PLAN A58). The `windows-smoke` job installs every Windows release on a
  # Windows runner; docs/releasing.md has the details.
  WINDOWS_RELEASE: "true"

# Actions are pinned to full commit SHAs (the tag is in the comment), as in ci.yml.
jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      archives: ${{ steps.matrix.outputs.archives }}
      windows: ${{ steps.matrix.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tagged commit must be on main
        # A tag on a side branch would otherwise build and sign whatever that branch contains, and `dove upgrade`
        # runs the result as root. This is a tripwire, not a guarantee: a tag carries its own copy of this file, so
        # the real boundary is who can push tags (see docs/releasing.md, "Release trust").
        run: |
          set -eu
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; tag a commit that main contains"
            exit 1
          fi
      - name: Tag must equal v + Cargo.toml version
        id: meta
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version=$(awk '/^\[package\]/{p=1; next} /^\[/{p=0} p && /^version[[:space:]]*=/{gsub(/^[^"]*"|".*$/, ""); print; exit}' Cargo.toml)
          if [ -z "$version" ]; then echo "::error::cannot read version from Cargo.toml"; exit 1; fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::version $version is not X.Y.Z or X.Y.Z-pre"
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Build matrix
        id: matrix
        run: |
          set -eu
          # One entry per release archive. ubuntu-22.04 (glibc 2.35) keeps the gnu binaries runnable on older
          # distributions and inside the distroless debian12 image (glibc 2.36); the musl ones are static and run
          # anywhere (Alpine). The arm64 runners are native: no QEMU. x86_64-apple-darwin is cross-compiled on the
          # arm64 macOS runner (the Intel runner needed 21 minutes, the other targets about 6).
          # aarch64-pc-windows-msvc is not built: it needs the windows-11-arm runner and an arm64 OpenSSL/NASM setup
          # that nobody has tried yet (see docs/releasing.md).
          matrix='[
            {"target": "x86_64-unknown-linux-gnu", "runner": "ubuntu-22.04"},
            {"target": "aarch64-unknown-linux-gnu", "runner": "ubuntu-22.04-arm"},
            {"target": "x86_64-unknown-linux-musl", "runner": "ubuntu-22.04"},
            {"target": "aarch64-unknown-linux-musl", "runner": "ubuntu-22.04-arm"},
            {"target": "aarch64-apple-darwin", "runner": "macos-15"},
            {"target": "x86_64-apple-darwin", "runner": "macos-15"}
          ]'
          if [ "$WINDOWS_RELEASE" = true ]; then
            matrix=$(printf '%s' "$matrix" | jq -c '. + [{"target": "x86_64-pc-windows-msvc", "runner": "windows-2022"}]')
          else
            matrix=$(printf '%s' "$matrix" | jq -c '.')
          fi
          {
            echo "matrix=$matrix"
            echo "archives=$(printf '%s' "$matrix" | jq 'length')"
            echo "windows=$WINDOWS_RELEASE"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$matrix" | jq -r '.[].target'
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          # The section "## [VERSION]"; a prerelease may fall back to "## [Unreleased]".
          section() {
            awk -v h="## [$1]" 'index($0, h) == 1 {p=1; next} /^## \[/{p=0} /^\[[^]]*\]: /{next} p' CHANGELOG.md
          }
          notes=$(section "$VERSION")
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            case "$VERSION" in
              *-*) notes=$(section "Unreleased") ;;
            esac
          fi
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no notes for $VERSION"
            exit 1
          fi
          printf '%s\n' "$notes" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.verify.outputs.matrix) }}
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tag runs only restore the cache that release-cache.yml saved on main (same shared key per target).
      - uses: ./.github/actions/release-build
        with:
          target: ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: |
          set -eu
          exe=dove
          if [ "$RUNNER_OS" = Windows ]; then exe=dove.exe; fi
          bin="target/$TARGET/release/$exe"
          case "$TARGET" in
            x86_64-apple-darwin)
              # Cross-compiled on arm64: the file must be x86_64 only. Running it needs Rosetta.
              archs=$(lipo -archs "$bin")
              echo "architectures: $archs"
              if [ "$archs" != x86_64 ]; then echo "::error::expected an x86_64 binary, got '$archs'"; exit 1; fi
              if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
                echo "::warning::Rosetta is not available on this runner, so the x86_64 binary was checked but not run"
                exit 0
              fi
              ;;
            *-linux-musl)
              file "$bin"
              if ! file "$bin" | grep -q 'statically linked\|static-pie linked'; then
                echo "::error::the musl binary is not statically linked"
                exit 1
              fi
              ;;
          esac
          out=$("$bin" --version)
          echo "$out"
          expected="dove ${TAG#v}"
          if [ "$out" != "$expected" ]; then echo "::error::expected '$expected'"; exit 1; fi
      - name: Smoke test in Alpine
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          set -eu
          # A musl build has to run on a musl system, not only on this glibc host.
          docker run --rm -v "$PWD/target/$TARGET/release:/d:ro" \
            alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf /d/dove --version
      - name: Package
        shell: bash
        run: |
          set -eu
          name="dove-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          install -m 0644 LICENSE README.md "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            install -m 0755 "target/$TARGET/release/dove.exe" "dist/$name/dove.exe"
            python -I deploy/release/make-zip.py dist "$name"
          else
            install -m 0755 "target/$TARGET/release/dove" "dist/$name/dove"
            COPYFILE_DISABLE=1 tar -C dist -czf "dist/$name.tar.gz" "$name"
            tar -tzf "dist/$name.tar.gz"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  deb:
    name: debian packages
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      # cargo-deb is installed from crates.io at a fixed version, not through a third-party action.
      CARGO_DEB_VERSION: "3.8.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*-linux-gnu
          path: assets
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version "$CARGO_DEB_VERSION"
      - name: Build the packages
        run: |
          set -eu
          # The package carries the glibc build of the release (the same binary as the gnu archive), so it is
          # exactly what was smoke-tested. The binary is already stripped. Debian orders prereleases with "~".
          debver="${VERSION/-/\~}"
          mkdir -p dist
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            name="dove-${TAG}-${target}"
            mkdir -p "target/$target/release"
            tar -xzf "assets/$name.tar.gz" -C "$RUNNER_TEMP" "$name/dove"
            install -m 0755 "$RUNNER_TEMP/$name/dove" "target/$target/release/dove"
            cargo deb --locked --no-build --no-strip --target "$target" --deb-version "$debver" --output dist/
          done
          # GitHub release asset names do not keep "~": use "-" in the file name (the package version is unchanged).
          for f in dist/*~*; do
            [ -e "$f" ] || continue
            mv "$f" "${f//\~/-}"
          done
          ls -l dist
      - name: Inspect the packages
        run: |
          set -eu
          test "$(find dist -name '*.deb' | wc -l)" -eq 2
          for deb in dist/*.deb; do
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
            test "$(dpkg-deb -f "$deb" Package)" = dove
            test "$(dpkg-deb -f "$deb" Version)" = "${VERSION/-/\~}"
            # /etc/dove must not ship in the package: the maintainer script creates it with the right mode.
            if dpkg-deb -c "$deb" | grep -q ' \./etc/'; then echo "::error::$deb ships files below /etc"; exit 1; fi
          done
          amd64=$(ls dist/dove_*_amd64.deb)
          arm64=$(ls dist/dove_*_arm64.deb)
          dpkg-deb --fsys-tarfile "$amd64" | tar -xO ./usr/bin/dove | file - | grep -q 'x86-64'
          dpkg-deb --fsys-tarfile "$arm64" | tar -xO ./usr/bin/dove | file - | grep -q 'ARM aarch64'
      - name: Install the amd64 package on Ubuntu 22.04
        run: |
          set -eu
          # Ubuntu 22.04 has glibc 2.35 and no systemd inside the container: this checks the Depends line, the
          # fallback account creation and the directory modes.
          docker run --rm -v "$PWD/dist:/deb:ro" \
            ubuntu@sha256:74b12b11ffa550fba1929ad4d8d16533c34f6612728469671afba1b03b66881c sh -ec '
              dpkg -i /deb/dove_*_amd64.deb
              dove --version
              getent passwd dove
              test "$(stat -c "%a %U:%G" /etc/dove)" = "750 root:dove"
              test "$(stat -c "%a %U:%G" /etc/dove/credentials)" = "700 root:root"
              test -z "$(ls -A /etc/dove/credentials)"
              dpkg -r dove
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debs
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: sign and publish
    needs: [verify, build, deb]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # attestations
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      EXPECTED_ARCHIVES: ${{ needs.verify.outputs.archives }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debs
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          minisign -v
      - name: Checksums
        working-directory: assets
        run: |
          set -eu
          # Every archive of the build matrix (tar.gz, and the Windows zip when it is enabled) plus the two .deb
          # packages, sorted by name.
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \) -printf '%f\n' | sort > archives.txt
          cat archives.txt
          test "$(wc -l < archives.txt)" -eq "$((EXPECTED_ARCHIVES + 2))"
          xargs sha256sum < archives.txt > SHA256SUMS
          rm archives.txt
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          if [ -z "$MINISIGN_SECRET_KEY" ]; then echo "::error::secret MINISIGN_SECRET_KEY is not set"; exit 1; fi
          umask 077
          keyfile="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keyfile"
          # The key has no password, so minisign does not prompt.
          minisign -S -s "$keyfile" -m assets/SHA256SUMS -t "dove $TAG" < /dev/null
          rm -f "$keyfile"
      - name: Verify the signature with the committed public key
        run: |
          set -eu
          minisign -V -p deploy/release/minisign.pub -m assets/SHA256SUMS -x assets/SHA256SUMS.minisig
          if [ "$(sed -n 3p assets/SHA256SUMS.minisig)" != "trusted comment: dove $TAG" ]; then
            echo "::error::unexpected trusted comment"
            exit 1
          fi
      - name: Add the installers
        run: |
          install -m 0755 install.sh assets/install.sh
          install -m 0644 install.ps1 assets/install.ps1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/*.tar.gz
            assets/*.zip
            assets/*.deb
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # assets/*.zip matches nothing while the Windows release is off.
          shopt -s nullglob
          if [ "$PRERELEASE" = true ]; then
            pre=--prerelease
          else
            pre=--latest
          fi
          gh release create "$TAG" "$pre" \
            --verify-tag --title "dove $TAG" --notes-file notes/release-notes.md \
            assets/*.tar.gz assets/*.zip assets/*.deb assets/SHA256SUMS assets/SHA256SUMS.minisig assets/install.sh assets/install.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: assets/SHA256SUMS
          if-no-files-found: error

  windows-smoke:
    name: Windows install smoke test
    needs: [verify, release]
    if: needs.verify.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      REPO: ${{ github.repository }}
      # An earlier Windows release that `dove upgrade` must be able to leave for this one. Windows releases start
      # with 0.5.0-rc.1, so that release itself skips the upgrade check.
      UPGRADE_FROM: "0.5.0-rc.1"
    steps:
      - name: install.ps1 installs this release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DOVE_VERSION = $env:VERSION
          $env:DOVE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'dove'
          $env:DOVE_NO_PATH = '1'
          irm "https://github.com/$env:REPO/releases/download/v$env:VERSION/install.ps1" | iex
          $out = & (Join-Path $env:DOVE_INSTALL_DIR 'dove.exe') --version
          Write-Output $out
          if ($out -ne "dove $env:VERSION") { throw "expected 'dove $env:VERSION', got '$out'" }
      - name: Local mode starts, answers and stops
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dove = Join-Path $env:RUNNER_TEMP 'dove\dove.exe'
          & $dove local init --port 18787
          if ($LASTEXITCODE -ne 0) { throw "dove local init failed" }
          $log = Join-Path $env:RUNNER_TEMP 'dove-local.log'
          $p = Start-Process -FilePath $dove -ArgumentList @('local', 'start', '--log-file', $log) -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18787/.well-known/oauth-protected-resource'
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          & $dove local status
          if (-not $ok) { Get-Content $log -ErrorAction SilentlyContinue; throw "local mode did not answer on 127.0.0.1:18787" }
          & $dove local stop
          if ($LASTEXITCODE -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "dove local stop failed" }
          if (-not $p.WaitForExit(20000)) { Stop-Process -Id $p.Id -Force; throw "dove kept running after dove local stop" }
      - name: dove upgrade reaches this release from the previous Windows release
        if: env.VERSION != env.UPGRADE_FROM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DOVE_VERSION = $env:UPGRADE_FROM
          $env:DOVE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'dove-old'
          $env:DOVE_NO_PATH = '1'
          irm "https://github.com/$env:REPO/releases/download/v$env:UPGRADE_FROM/install.ps1" | iex
          $dove = Join-Path $env:DOVE_INSTALL_DIR 'dove.exe'
          & $dove upgrade --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "dove upgrade failed" }
          $out = & $dove --version
          Write-Output $out
          if ($out -ne "dove $env:VERSION") { throw "expected 'dove $env:VERSION' after the upgrade, got '$out'" }

  homebrew:
    name: homebrew tap
    needs: [verify, release]
    # Prereleases never reach the tap (like the X.Y and latest image tags).
    if: needs.verify.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAP_REPO: dominik-lenhart/homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: sums
      - name: Render the formula
        run: |
          set -eu
          # Fails unless SHA256SUMS lists all four platforms exactly once.
          sh deploy/homebrew/render.sh "$VERSION" sums/SHA256SUMS > dove.rb
          ruby -c dove.rb
          cat dove.rb
      - name: Push it to the tap
        env:
          # Write deploy key of the tap repository only (ed25519); it cannot touch any other repository.
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -eu
          if [ -z "$TAP_DEPLOY_KEY" ]; then echo "::error::secret HOMEBREW_TAP_DEPLOY_KEY is not set"; exit 1; fi
          umask 077
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          # GitHub's published SSH host keys (over HTTPS), not trust-on-first-use.
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
          test -s "$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          git clone --depth 1 "git@github.com:$TAP_REPO.git" tap
          mkdir -p tap/Formula
          cp dove.rb tap/Formula/dove.rb
          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "The tap already has this formula."
          else
            git add Formula/dove.rb
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "dove $VERSION" -m "Generated by the release workflow of dominik-lenhart/dove from the signed SHA256SUMS of v$VERSION."
            git push origin HEAD:main
          fi
          rm -f "$RUNNER_TEMP/tap_key"

  image:
    name: container image
    needs: [verify, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # attestations
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*-linux-gnu
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: sums
      - name: Extract the verified linux binaries
        run: |
          set -eu
          # Only the two linux archives are present; check them against the checksum list that was signed.
          (cd assets && grep -E ' dove-.*-linux-gnu\.tar\.gz$' ../sums/SHA256SUMS | sha256sum -c -)
          for pair in x86_64-unknown-linux-gnu:amd64 aarch64-unknown-linux-gnu:arm64; do
            target=${pair%%:*}
            arch=${pair##*:}
            name="dove-${TAG}-${target}"
            mkdir -p "image-context/linux-$arch"
            tar -xzf "assets/$name.tar.gz" -C "$RUNNER_TEMP" "$name/dove"
            install -m 0755 "$RUNNER_TEMP/$name/dove" "image-context/linux-$arch/dove"
          done
          ls -l image-context/*
      - name: Image tags
        id: tags
        run: |
          set -eu
          minor=${VERSION%.*}
          {
            echo "list<<EOF"
            echo "$IMAGE:$VERSION"
            # Prereleases never move X.Y or latest.
            if [ "$PRERELEASE" != true ]; then
              echo "$IMAGE:$minor"
              echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image-context
          file: deploy/Containerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false # the GitHub attestation below covers provenance
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
