name: CI

# Docs-only changes (Markdown anywhere, docs/) skip every job. paths-ignore applies to push and pull_request only, so
# the weekly schedule below still runs the audit and the secret scan over the whole history, docs-only commits included.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  # Advisories appear independently of commits, so audit the dependencies weekly too.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run; a tag is never cancelled (the schedule gets
# its own group so a push to main cannot cancel it).
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# Actions are pinned to full commit SHAs (the tag is in the comment). Update them deliberately, for example with
# Dependabot, and review the diff.
jobs:
  fmt:
    name: rustfmt
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Integration tests run against the fake Google server in tests/support/. CI never talks to real Google.
      # Hosted runners have 4 cores (the dev host runs the suite with 2 threads because it is shared).
      - run: cargo test --locked -- --test-threads=4

  # Decides whether the platform jobs below run: they only matter when Rust code, tests or build inputs changed.
  changes:
    name: changed paths
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -eu
          rust=true
          # A new branch or a force push has no usable base: run everything.
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(src/|tests/|build\.rs|Cargo\.(toml|lock)$|rust-toolchain|\.cargo/|\.github/workflows/ci\.yml$|\.github/actions/)'; then
              rust=false
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "platform jobs: $rust"

  macos:
    name: macOS check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Compiles the binary and every test target; keeps the macOS code paths (keychain, local mode) from rotting.
      # It does not run the suite: the Linux job does that, and macOS minutes are the expensive ones.
      - run: cargo check --locked --all-targets

  windows:
    name: Windows build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Gating since the Windows port (PLAN A58). The lib tests include the Windows-only ones (DACLs, DPAPI, the admin
    # pipe, replacing a running exe). The integration test files are not run here yet: most of them are Unix-only
    # (`#![cfg(unix)]`), and the rest have not been tried on Windows.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
      - uses: ./.github/actions/windows-build-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --bin dove
      - run: cargo test --locked --lib -- --test-threads=4

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not only the tip
          persist-credentials: false
      # gitleaks runs from its container image (pinned by digest) so no licence key or third-party action is needed.
      # The exit code is non-zero when a secret is found. Findings are redacted in the log.
      - name: gitleaks (git history)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --verbose

  deny:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Advisories (RustSec), licences, banned crates and allowed sources, configured in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
