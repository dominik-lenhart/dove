[package]
name = "dove-mcp"
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
description = "Self-hosted mail MCP server for AI agents (Gmail, token-scoped access, encrypted search index)"
license = "Apache-2.0"
repository = "https://github.com/dominik-lenhart/dove"
publish = false

[[bin]]
name = "dove"
path = "src/main.rs"

[lib]
name = "dove"
path = "src/lib.rs"

[dependencies]
# Runtime and HTTP
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "fs", "process"] }
tokio-util = "0.7"
futures = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "form", "original-uri"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query", "http2"] }
# IMAP/SMTP TLS: the same rustls stack, crypto provider and platform verifier reqwest uses (no second TLS path).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7"

# Storage. bundled-sqlcipher-vendored-openssl: SQLCipher + FTS5 built in, no system library needed.
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }

# Serialization and config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
toml_edit = "0.25"
toml = "1"

# Crypto
chacha20poly1305 = "0.11"
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"
getrandom = "0.4"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
base64 = "0.23"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }

# Mail
mail-builder = "2"
mail-parser = "1"
scraper = "0.29"
unicode-normalization = "0.1"
email_address = "0.2"

# CLI, logging, misc
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
ipnet = "2.12"
url = "2"
# Remote client: OS credential store (Keychain, Credential Manager, Secret Service) and no-echo prompts.
keyring = "4.2"
rpassword = "7.5"
nix = { version = "0.31", features = ["user", "resource", "fs", "process"] }
# Self-update (`dove upgrade`): release version compare, minisign check of the signed checksum list, archive extraction.
semver = "1"
minisign-verify = "0.3"
flate2 = "1.1"
tar = { version = "0.4", default-features = false }
# Windows release archives (.zip): reading only, deflate through flate2 (no zstd/bzip2/lzma/aes).
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }

# Test support module (`dove::testing`), enabled for this crate's own tests via the self dev-dependency below.
tempfile = { version = "3", optional = true }
lopdf = { version = "0.47", default-features = false }

[features]
testing = ["dep:tempfile"]

[dev-dependencies]
tempfile = "3"
dove-mcp = { path = ".", features = ["testing"] }

# Debian/Ubuntu package (`cargo deb --no-build --no-strip --target <triple>`, see docs/releasing.md). The binary is
# built (and stripped) by the release workflow. The package creates the `dove` user and /etc/dove, installs the unit,
# and generates no secrets; it does not enable or start the service.
[package.metadata.deb]
name = "dove"
maintainer = "Dominik Lenhart <noreply@github.com>"
copyright = "Dominik Lenhart"
extended-description = """\
Dove gives AI agents token-scoped read and draft access to Gmail and IMAP mailboxes over MCP. \
This package installs the dove binary, a hardened systemd unit and the service account. \
Configuration and secrets are the operator's job: see docs/deployment.md."""
section = "mail"
priority = "optional"
# libc6 2.35: the Linux builds run on Ubuntu 22.04 (glibc 2.35). libgcc-s1 provides libgcc_s.so.1.
depends = "libc6 (>= 2.35), libgcc-s1"
recommends = "systemd"
maintainer-scripts = "deploy/deb/"
assets = [
    ["target/release/dove", "usr/bin/", "755"],
    ["deploy/deb/dove.service", "usr/lib/systemd/system/dove.service", "644"],
    ["deploy/systemd/dove.sysusers.conf", "usr/lib/sysusers.d/dove.conf", "644"],
    ["deploy/systemd/dove.tmpfiles.conf", "usr/lib/tmpfiles.d/dove.conf", "644"],
    ["README.md", "usr/share/doc/dove/README.md", "644"],
    ["docs/deployment.md", "usr/share/doc/dove/deployment.md", "644"],
    ["LICENSE", "usr/share/doc/dove/copyright", "644"],
]

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

# Faster dev and test builds on the shared host: line tables keep panics and backtraces readable, dependencies
# carry no debug info (smaller objects, much less link time for the ~25 integration test binaries).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
